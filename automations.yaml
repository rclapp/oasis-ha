# On Air button (Samjin, ZHA quirk zhaquirks.samjin.button:SamjinButton):
# single press turns the light on, double press turns it off.
- id: on_air_button_light_toggle
  alias: On Air button - light on/off
  mode: queued
  triggers:
    - trigger: event
      event_type: zha_event
      event_data:
        device_ieee: "28:6d:97:00:01:13:e7:45"
        command: button_single
      id: single
    - trigger: event
      event_type: zha_event
      event_data:
        device_ieee: "28:6d:97:00:01:13:e7:45"
        command: button_double
      id: double
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: single
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.your_light # TODO: replace with your light
        - conditions:
            - condition: trigger
              id: double
          sequence:
            - action: light.turn_off
              target:
                entity_id: light.your_light # TODO: replace with your light

# Pause main-floor HVAC while the front door is held open, then resume it.
# Only acts if the HVAC was running when the door opened; if it was already
# off, nothing happens and nothing is turned back on.
- id: front_door_open_pause_main_floor_hvac
  alias: Front door open - pause main floor HVAC
  mode: single
  variables:
    door: binary_sensor.front_door_door # TODO: August DoorSense entity
    thermostat: climate.main_floor # TODO: main floor Ecobee entity
  triggers:
    - trigger: state
      entity_id: binary_sensor.front_door_door # TODO: same as `door` above
      to: "on"
      for: "00:01:00"
  conditions:
    - condition: template
      value_template: "{{ states(thermostat) not in ['off', 'unavailable', 'unknown'] }}"
  actions:
    # Remember the mode for this run only (heat, cool or heat_cool) so the
    # same one is restored when the door closes.
    - variables:
        resume_mode: "{{ states(thermostat) }}"
    - action: climate.set_hvac_mode
      target:
        entity_id: "{{ thermostat }}"
      data:
        hvac_mode: "off"
    # A template wait also passes if the door closed while the HVAC was
    # being switched off.
    - wait_template: "{{ is_state(door, 'off') }}"
    - action: climate.set_hvac_mode
      target:
        entity_id: "{{ thermostat }}"
      data:
        hvac_mode: "{{ resume_mode }}"
